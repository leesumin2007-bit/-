<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15×15 오목</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef5ff;font-family:system-ui,sans-serif;color:#172033}.wrap{max-width:980px;margin:auto;padding:24px 14px}h1{text-align:center;margin:0 0 8px}.sub{text-align:center;color:#65748b}.layout{display:grid;grid-template-columns:minmax(280px,650px) 280px;gap:20px;align-items:start}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 30px #7892b333}.wood{position:relative;background:#d69b50;padding:12px;border-radius:10px}.board{display:grid;grid-template-columns:repeat(15,1fr);aspect-ratio:1;background:#e5b36c;border:1px solid #74471e}.cell{position:relative;border:0;background:transparent;padding:0;min-width:0;cursor:pointer}.cell:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #774b22}.cell:after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px solid #774b22}.cell:disabled{cursor:default}.stone{position:absolute;z-index:2;inset:12%;border-radius:50%;pointer-events:none;box-shadow:2px 3px 4px #0006,inset 2px 2px 5px #fff5}.black{background:radial-gradient(circle at 35% 28%,#777,#111 55%,#000)}.white{background:radial-gradient(circle at 35% 28%,#fff,#ddd 60%,#999);border:1px solid #888}.last .stone{outline:3px solid #f43f5e;outline-offset:2px}.result{position:absolute;z-index:5;inset:0;display:grid;place-items:center;background:#0007;border-radius:10px}.result strong{color:#fff;background:#172033eF;border:3px solid #fff;padding:18px 28px;border-radius:16px;font-size:clamp(1.7rem,5vw,3rem);box-shadow:0 8px 25px #0008}.side h2{font-size:1.1rem;margin-top:0}.levels{display:flex;gap:6px}.levels button,.action{border:0;border-radius:9px;padding:11px 8px;font-weight:700;cursor:pointer}.levels button{flex:1;background:#e8eef7;color:#52627a}.levels .on{background:#2563eb;color:#fff}.action{width:100%;margin-top:10px;background:#172033;color:white}.secondary{background:#e8eef7;color:#172033}.status{text-align:center;background:#f1f5f9;border-radius:9px;padding:12px;margin:14px 0;font-weight:700}.rules{border-top:1px solid #e5eaf0;margin-top:20px;padding-top:15px;color:#52627a;line-height:1.6;font-size:.9rem}.legend{text-align:center;color:#65748b;font-size:.9rem;margin-top:10px}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{order:2}}
</style></head>
<body><main class="wrap"><h1>15×15 오목</h1><p class="sub">컴퓨터와 대결하세요</p><section class="layout"><div class="card"><div class="wood"><div id="board" class="board"></div><div id="result" class="result" hidden><strong id="resultText"></strong></div></div><div class="legend">● 흑돌: 나　 ○ 백돌: 컴퓨터</div></div><aside class="card side"><h2>난이도</h2><div class="levels"><button data-level="easy">하수</button><button data-level="normal" class="on">중수</button><button data-level="hard">고수</button></div><div id="status" class="status">난이도를 선택한 뒤 시작 버튼을 눌러주세요.</div><button id="start" class="action">게임 시작</button><button id="restart" class="action secondary">다시하기</button><button id="change" class="action secondary">난이도 다시 선택하기</button><div class="rules"><b>오목 규칙</b><ol><li>흑돌과 백돌이 번갈아 놓습니다.</li><li>가로, 세로, 대각선으로 같은 돌 5개를 먼저 연결하면 승리합니다.</li><li>돌은 한 번 놓으면 옮길 수 없습니다.</li></ol></div></aside></section></main>
<script>
const N=15,dirs=[[1,0],[0,1],[1,1],[1,-1]],boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),resultEl=document.getElementById('result'),resultText=document.getElementById('resultText');let a=[],cells=[],level='normal',busy=true,over=false,last=null;
function init(){a=Array.from({length:N},()=>Array(N).fill(0));cells=[];busy=true;over=false;last=null;resultEl.hidden=true;boardEl.innerHTML='';for(let r=0;r<N;r++){cells[r]=[];for(let c=0;c<N;c++){let b=document.createElement('button');b.className='cell';b.onclick=()=>move(r,c);boardEl.appendChild(b);cells[r][c]=b}}statusEl.textContent='난이도를 선택한 뒤 시작 버튼을 눌러주세요.';draw()}
function startGame(){a=Array.from({length:N},()=>Array(N).fill(0));busy=false;over=false;last=null;resultEl.hidden=true;statusEl.textContent='내 차례입니다. 흑돌을 놓아주세요.';draw()}
function draw(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){let b=cells[r][c];b.disabled=busy||over||!!a[r][c];b.classList.toggle('last',last&&last[0]===r&&last[1]===c);let s=b.querySelector('.stone');if(s)s.remove();if(a[r][c]){s=document.createElement('i');s.className='stone '+(a[r][c]===1?'black':'white');b.appendChild(s)}}}
function put(r,c,v){a[r][c]=v;last=[r,c];draw()}
function count(r,c,dr,dc,v){let n=0;for(let i=1;;i++){let y=r+dr*i,x=c+dc*i;if(y<0||y>=N||x<0||x>=N||a[y][x]!==v)return n;n++}}
function win(r,c,v){return dirs.some(([dr,dc])=>1+count(r,c,dr,dc,v)+count(r,c,-dr,-dc,v)>=5)}
function full(){return a.every(row=>row.every(Boolean))}
function finish(text,overlay){over=true;busy=false;statusEl.textContent=text;resultText.textContent=overlay;resultEl.hidden=false;draw()}
function move(r,c){if(busy||over||a[r][c])return;put(r,c,1);if(win(r,c,1))return finish('이겼습니다!','이겼습니다!');if(full())return finish('무승부입니다.','무승부');busy=true;statusEl.textContent='컴퓨터가 생각 중입니다…';draw();setTimeout(ai,300)}
function candidates(){let q=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!a[r][c]){let near=false;for(let y=Math.max(0,r-2);y<=Math.min(N-1,r+2);y++)for(let x=Math.max(0,c-2);x<=Math.min(N-1,c+2);x++)if(a[y][x])near=true;if(near||!a.flat().some(Boolean))q.push([r,c])}return q}
function score(r,c,v){let z=0;for(let [dr,dc] of dirs){let n=1,o=0;for(let s of[-1,1])for(let i=1;i<6;i++){let y=r+dr*i*s,x=c+dc*i*s;if(y<0||y>=N||x<0||x>=N)break;if(a[y][x]===v)n++;else{if(!a[y][x])o++;break}}z+=n>=5?100000:n===4?(o===2?10000:1000):n===3?(o===2?500:80):n===2?(o===2?30:8):0}return z}
function ai(){let q=candidates();if(!q.length)return finish('무승부입니다.','무승부');let pick=q[0];if(level==='easy')pick=q[Math.floor(Math.random()*q.length)];else{let best=-1;for(let p of q){let z=score(p[0],p[1],2)*(level==='hard'?1.35:1.15)+score(p[0],p[1],1)*(level==='hard'?1.15:1);if(z>best){best=z;pick=p}}}busy=false;put(pick[0],pick[1],2);if(win(pick[0],pick[1],2))finish('패배하셨습니다.','패배하셨습니다.');else if(full())finish('무승부입니다.','무승부');else{statusEl.textContent='내 차례입니다. 흑돌을 놓아주세요.';draw()}}
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-level]').forEach(x=>x.classList.remove('on'));b.classList.add('on');level=b.dataset.level;init()});document.getElementById('start').onclick=startGame;document.getElementById('restart').onclick=startGame;document.getElementById('change').onclick=init;init();
</script></body></html>
